# The image tag is the deployed version: release-please rewrites the annotated `image:` line in the
# release commit, so `main` records what prod runs. Change the tag by hand only to roll back
# (skillforge's README, "Rolling back").
services:
  app:
    image: ghcr.io/nachhilfe-leon-weimann/skillsite:v1.2.6 # x-release-please-version
    pull_policy: always
    restart: unless-stopped
    init: true
    env_file:
      - .env
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    # Healthcheck ships in the image (see Dockerfile); not duplicated here.
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Routing lives here, not in a Dokploy domain: Dokploy strips every label aimed at the routers it
    # generates, so a domain entry there could not require Cloudflare's client certificate.
    # `cloudflare-origin-pull@file` (Authenticated Origin Pulls) and `redirect-to-https@file` are
    # defined in Traefik's dynamic config on the server.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.skillsite.loadbalancer.server.port=3000"
      - "traefik.http.routers.skillsite-web.rule=Host(`nachhilfe.leonweimann.de`)"
      - "traefik.http.routers.skillsite-web.entrypoints=web"
      - "traefik.http.routers.skillsite-web.middlewares=redirect-to-https@file"
      - "traefik.http.routers.skillsite-web.service=skillsite"
      - "traefik.http.routers.skillsite-websecure.rule=Host(`nachhilfe.leonweimann.de`)"
      - "traefik.http.routers.skillsite-websecure.entrypoints=websecure"
      - "traefik.http.routers.skillsite-websecure.tls=true"
      - "traefik.http.routers.skillsite-websecure.tls.options=cloudflare-origin-pull@file"
      - "traefik.http.routers.skillsite-websecure.service=skillsite"
    networks:
      - dokploy-network
      - default

networks:
  dokploy-network:
    external: true
