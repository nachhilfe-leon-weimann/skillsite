# The image tag is the deployed version: release-please rewrites the annotated `image:` line in the
# release commit, so `main` records what prod runs. Change the tag by hand only to roll back
# (skillforge's README, "Rolling back").
services:
  app:
    image: ghcr.io/nachhilfe-leon-weimann/skillsite:v1.2.4 # x-release-please-version
    pull_policy: always
    restart: unless-stopped
    init: true
    env_file:
      - .env
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    # Healthcheck ships in the image (see Dockerfile); not duplicated here.
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
