packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

overrides:
  # Keep one shared, patched layer/focus context across Dialog and later Popover/Select.
  # Remove the layer patch/pins after an upstream release passes both #4143 regressions.
  "@radix-ui/react-dismissable-layer": 1.2.1
  "@radix-ui/react-focus-scope": 1.3.1
  "brace-expansion@<1.1.18": 1.1.18
  "js-yaml@>=4.0.0 <4.3.1": 4.3.1

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "@types/react"
  - "@types/react-dom"

peerDependencyRules:
  allowedVersions:
    "@napi-rs/wasm-runtime>@emnapi/core": "1"
    "@napi-rs/wasm-runtime>@emnapi/runtime": "1"
    "tsconfck>typescript": "7"

patchedDependencies:
  "@radix-ui/react-dismissable-layer@1.2.1": patches/@radix-ui__react-dismissable-layer@1.2.1.patch
